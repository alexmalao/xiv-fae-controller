name: Release

# Builds the plugin on a version tag, attaches latest.zip to a GitHub release,
# and updates the Dalamud repository manifest (pluginmaster.json) so clients see the new version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin
    runs-on: windows-2022

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build --configuration Release

      - name: Check the package
        shell: pwsh
        run: |
          $zip = "FaeController/bin/x64/Release/FaeController/latest.zip"
          if (-not (Test-Path $zip)) {
              throw "The packager did not produce $zip."
          }

          Get-Item $zip | Select-Object FullName, Length

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "FaeController/bin/x64/Release/FaeController/latest.zip#latest.zip" `
            --title "Fae Nightwolf's Controller Additions $tag" `
            --generate-notes `
            --latest

      - name: Update the repository manifest
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")

          # Dalamud compares a four-part assembly version.
          $parts = @($version.Split("."))
          while ($parts.Count -lt 4) { $parts += "0" }
          $assemblyVersion = $parts[0..3] -join "."

          git fetch origin master
          git checkout master

          $manifest = Get-Content pluginmaster.json -Raw | ConvertFrom-Json
          $manifest[0].AssemblyVersion = $assemblyVersion
          $manifest[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $manifest | ConvertTo-Json -Depth 5 | Set-Content pluginmaster.json -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "chore: update plugin manifest for $version"
          git push origin master
